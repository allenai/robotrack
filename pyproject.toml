[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "robotrack"
version = "0.1.0"
description = "RoboTrack: point tracking for real-world robotic manipulation"
readme = "README.md"
# Apache-2.0 for this repository, except robotrack/alltracker/ (MIT, vendored AllTracker) and robotrack/cowtracker/
# (FAIR Noncommercial Research License); each folder has its LICENSE file.
license = { text = "Apache-2.0 AND MIT AND LicenseRef-FAIR-Noncommercial" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "torchvision",
    "einops",
    "numpy",
    "opencv-python",
    "huggingface_hub",
]

[project.optional-dependencies]
train = ["hydra-core>=1.3", "omegaconf", "imageio", "pillow", "wandb"]
# RoboTracker-Warp: the packages CoWTracker needs (its environments.yml, without its demo and debugging tools).
# xformers ships compiled kernels for one torch release, so the three are pinned together (xformers 0.0.34 declares
# torch==2.10.0; 0.0.36 needs extra kernels from the PyTorch index). timm 1.0.31 passes is_causal to attention
# layers, which CoWTracker's do not accept.
warp = ["torch==2.10.0", "torchvision==0.25.0", "xformers==0.0.34", "timm==1.0.25", "scipy", "matplotlib", "mediapy", "pillow"]
all = ["robotrack[train,warp]"]

[tool.setuptools.packages.find]
include = ["robotrack*"]

[tool.setuptools.package-data]
robotrack = ["*.csv", "*.txt"]
