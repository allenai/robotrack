# RoboTracker: fine-tune the released AllTracker for 10k steps on 50% Kubric + 50% RoboTrack-15M.
#   torchrun --nproc_per_node=8 -m robotrack.training.train kubric_root=... robotrack15m_root=...

defaults:
  - _self_
  - model: alltracker
  - data: robotrack15m_50_mix

exp_name: robotracker
exp_dir: ./runs/${exp_name}
seed: 42

# AllTracker's Kubric exports (https://huggingface.co/datasets/aharley/alltracker_data): a folder holding kubric_au/
# (24-frame clips) and ce64/kublong/ (64-frame clips).
kubric_root: ???
# RoboTrack-15M (https://huggingface.co/datasets/allenai/RoboTrack-15M), downloaded as is.
robotrack15m_root: ???

training:
  num_steps: 10000
  batch_size: 1                 # per GPU
  num_workers: 8                # a data group may set its own
  mixed_precision: true
  precision: bf16
  gradient_clip_norm: 1.0
  sliding_window_len: 16
  use_huber_loss: false
  visible_loss_weight: 0.05
  invisible_loss_weight: 0.01
  deterministic_samples: true   # each sample's randomness is keyed by epoch, index and rank: exact resume
  loss_in_fp32: false
  clamp_loss_probs: false
  skip_nonfinite_batches: false
  max_loss_threshold: null

optimizer:
  lr: 1.0e-5
  weight_decay: 5.0e-4

scheduler:                      # one-cycle, cosine
  use_scheduler: true
  pct_start: 0.05

distributed:
  backend: nccl
  timeout_mins: 30
  find_unused_parameters: false
  gradient_as_bucket_view: false
  bucket_cap_mb: 25
  broadcast_buffers: true
  # Set to 8 on 4 GPUs (or 2) to reproduce the 8-GPU run: each GPU hosts 8/W ranks' data and sums their gradients.
  virtual_world_size: null

cuda:
  cudnn_deterministic: true
  cudnn_benchmark: false
  allow_tf32: true

checkpoint:
  save_dir: ${exp_dir}/checkpoints
  save_every_n_steps: 2000
  num_checkpoints: null         # keep every step checkpoint; latest.pth and final_model.pth come in addition
  resume_from: null             # full training state; a run also resumes from its own latest.pth automatically
  restore_ckpt: https://huggingface.co/aharley/alltracker/resolve/main/alltracker.pth   # start weights (path or URL)
  strict: false                 # the time embedding is rebuilt for the training clip length

logging:
  log_dir: ${exp_dir}/logs
  log_freq: 997
  scalar_freq: 53
  log_ranks: [0]
  metric_window: 50
  metric_min_size: 10
  wandb:                        # off by default; logging.wandb.enabled=true to turn on (rank 0 only)
    enabled: false
    project: robotrack
    entity: null
    name: ${exp_name}
    tags: []
    notes: null
    group: null
    mode: online
    dir: ${exp_dir}
    id: null
    resume: allow

hydra:                          # keep Hydra's own logs in the run folder (not ./outputs)
  run:
    dir: ${exp_dir}/hydra
  job:
    chdir: false
