# @package data
# 100% RoboTrack-15M (or data generated in its format), no Kubric: two groups, one per GPU half on 8 GPUs (1:1). The same
# clip shapes as the RoboTracker mix (robotrack15m_50_mix.yaml). In our experiments the 50% Kubric mix scores higher on
# real video than this; use it to study the data on its own.
#   torchrun --nproc_per_node=8 -m robotrack.training.train data=robotrack15m_only robotrack15m_root=...

groups:
  - name: robotrack15m_long
    ratio: 1.0
    inference_iters: 3
    num_workers: 4
    dataset:
      _target_: robotrack.training.datasets.robotrack15m.RoboTrack15MDataset
      data_root: ${robotrack15m_root}
      manifest: manifests/metadata_long.jsonl
      crop_size: [256, 384]
      seq_len: 56
      traj_per_sample: 256
      use_augs: true
      shuffle: true

  - name: robotrack15m_short
    ratio: 1.0
    inference_iters: 4
    num_workers: 4
    dataset:
      _target_: robotrack.training.datasets.robotrack15m.RoboTrack15MDataset
      data_root: ${robotrack15m_root}
      manifest: manifests/metadata_short.jsonl
      crop_size: [384, 512]
      seq_len: 24
      traj_per_sample: 256
      use_augs: true
      shuffle: true
